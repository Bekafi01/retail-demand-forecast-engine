project:
  name: "retail-demand-forecast-engine"
  version: "0.1.0"
  random_seed: 42

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  external_data_dir: "data/external"
  models_dir: "models"
  reports_dir: "reports"
  figures_dir: "reports/figures"
  raw_calendar_file: "data/raw/calendar.csv"
  raw_prices_file: "data/raw/sell_prices.csv"
  raw_sales_train_file: "data/raw/sales_train_evaluation.csv"
  processed_sales_file: "data/processed/sales_long.parquet"
  processed_features_file: "data/processed/features_df.parquet"

forecast:
  horizon: 28  # 28 days forecasting horizon (M5 competition standard)
  frequency: "D"
  target_col: "sales"
  id_cols:
    - "item_id"
    - "store_id"
    - "dept_id"
    - "cat_id"
    - "state_id"
  series_id_col: "id"
  date_col: "date"
  day_idx_col: "d"

hierarchy:
  levels:
    1: "Total"
    2: "state_id"
    3: "store_id"
    4: "cat_id"
    5: "dept_id"
    6: ["state_id", "cat_id"]
    7: ["state_id", "dept_id"]
    8: ["store_id", "cat_id"]
    9: ["store_id", "dept_id"]
    10: "item_id"
    11: ["state_id", "item_id"]
    12: ["store_id", "item_id"]

data_split:
  train_start_d: 1
  train_end_d: 1913
  val_start_d: 1914
  val_end_d: 1941
  test_start_d: 1942
  test_end_d: 1969
  backtest_windows: 3
  backtest_step_size: 28

features:
  lags: [28, 35, 42, 49, 56, 63, 70]  # Safe lags >= 28 to prevent direct target leakage
  recursive_lags: [1, 2, 3, 7, 14, 21, 28]
  rolling_windows: [7, 14, 28, 60, 90, 180]
  rolling_stats: ["mean", "std", "min", "max", "skew"]
  ewma_alphas: [0.1, 0.3, 0.5]
  calendar_features:
    - "dayofweek"
    - "day"
    - "month"
    - "year"
    - "week"
    - "is_weekend"
    - "event_name_1"
    - "event_type_1"
    - "event_name_2"
    - "event_type_2"
    - "snap_CA"
    - "snap_TX"
    - "snap_WI"
  price_features:
    - "sell_price"
    - "price_max"
    - "price_min"
    - "price_std"
    - "price_mean"
    - "price_momentum_w"
    - "price_momentum_m"
    - "price_discount_ratio"
  categorical_cols:
    - "item_id"
    - "dept_id"
    - "cat_id"
    - "store_id"
    - "state_id"
    - "event_name_1"
    - "event_type_1"
    - "event_name_2"
    - "event_type_2"

models:
  baseline:
    naive_strategy: "last_value"
    seasonal_periods: [7, 28]
    moving_average_windows: [7, 28]
  
  statistical:
    auto_arima:
      seasonal: true
      m: 7
    croston:
      alpha: 0.1
    auto_theta:
      season_length: 7

  lightgbm:
    objective: "tweedie"  # Well-suited for zero-inflated continuous demand
    tweedie_variance_power: 1.15
    metric: "rmse"
    boosting_type: "gbdt"
    learning_rate: 0.05
    num_leaves: 63
    min_data_in_leaf: 50
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    n_estimators: 1200
    early_stopping_rounds: 50
    verbose: -1

  catboost:
    loss_function: "Tweedie:variance_power=1.15"
    eval_metric: "RMSE"
    iterations: 1000
    learning_rate: 0.06
    depth: 6
    early_stopping_rounds: 50
    verbose: 100

  hierarchical:
    methods:
      - "bottom_up"
      - "top_down"
      - "min_trace_ols"
      - "min_trace_wls"

mlops:
  experiment_name: "retail_demand_forecast"
  tracking_uri: "mlruns"
  model_registry_name: "m5_retail_demand_champion"
  metric_for_promotion: "wrmsse"
  promotion_threshold_improvement: 0.01

monitoring:
  psi:
    warning_threshold: 0.10
    critical_threshold: 0.20
  ks_test:
    alpha: 0.05
  error_tracking:
    wape_alert_threshold: 0.25
    rmsse_alert_threshold: 1.20
