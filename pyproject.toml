[project]
name = "retail-demand-forecast-engine"
version = "0.1.0"
description = "Production-grade retail demand forecasting platform based on M5 hierarchical dataset"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    "statsforecast>=1.7.0",
    "hierarchicalforecast>=0.4.0",
    "mlflow>=2.11.0",
    "evidently>=0.4.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "streamlit>=1.32.0",
    "plotly>=5.20.0",
    "pyyaml>=6.0.0",
    "joblib>=1.3.0",
    "tqdm>=4.66.0",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "ipykernel>=6.29.0",
    "nbformat>=5.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "mlops", "api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "F401", "E501"]
"ui/*" = ["E402"]
"mlops/*" = ["E402"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
